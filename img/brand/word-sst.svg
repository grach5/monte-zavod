<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -60 3819 305" fill="none" stroke="#ED9400" stroke-width="25">
  <!-- Самостоятельный wordmark «СТРОЙСПЕЦТЕХНИКА», не копия букв МОНТЕ:
       геометрическая монолиния, толщина штриха и модуль ширины буквы сняты
