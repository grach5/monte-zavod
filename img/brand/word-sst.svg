       между буквами ≈2 px (соотношение ≈0,045 — впритык). Здесь эти же
       соотношения на сетке 200: штрих 25, модуль буквы 230, зазор 9. Цвет
       #ED9400 — фирменный оранжевый, взят из word-sst.png (пиксель проверен,
       не подобран на глаз). Стыки прямые (miter), у «О»/«С» — скруглённый
       прямоугольник радиусом 1,1×штрих, как у эталона. -->
